name: karpathy-llm
version: 0.4.0
description: Andrej Karpathy's agent behavioral principles, context engineering guidelines, and autonomous LLM Wiki knowledge architecture
author: nu-nenoi
homepage: https://github.com/nu-nenoi/repo-nexus
rules:
  - rules/KARPATHY_RULES.md: .rnex/plugins/karpathy-llm/rules/KARPATHY_RULES.md
  - workflows/wiki-ingest.md: .rnex/plugins/karpathy-llm/workflows/wiki-ingest.md
  - workflows/wiki-lint.md: .rnex/plugins/karpathy-llm/workflows/wiki-lint.md
instructions:
  - instructions/karpathy-llm.md: .rnex/plugins/karpathy-llm/instructions/karpathy-llm.md
templates:
  - templates/index.md: wiki/index.md
  - templates/_log.md: wiki/_log.md
  - templates/hot.md: wiki/hot.md
  - templates/raw.gitkeep: raw/.gitkeep
  - templates/wiki-page.sample.md: .rnex/plugins/karpathy-llm/templates/wiki-page.template.md
  - templates/LLM_WIKI.sample.md: .rnex/plugins/karpathy-llm/templates/LLM_WIKI.sample.md
