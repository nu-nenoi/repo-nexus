# ==============================================================================
# rnex.yaml — Repo Nexus Workspace Configuration (Full Example)
# ==============================================================================
# This file is the central team manifest for a Repo Nexus workspace (committed to Git).
#
# TWO-LEVEL CONFIGURATION:
#   1. Repo Config (rnex.yaml): Shared across team, tracks member repos, URLs, plugins.
#   2. Local Config (.local.rnex.yaml): Machine-specific (gitignored, highest priority),
#      overrides enable/disable states, URLs, or local developer settings.
#
# Place it in your workspace root directory and run `rnex fix` to apply.
#
# For more information: https://github.com/nu-nenoi/repo-nexus

# ------------------------------------------------------------------------------
# version — Workspace configuration schema version
# ------------------------------------------------------------------------------
# Used by `rnex fix` and `rnex update` to safely detect and reconcile configuration
# and routing instructions across CLI releases.
#
version: 0.5.0

# ------------------------------------------------------------------------------
# repos_dir — Directory for member repository clones
# ------------------------------------------------------------------------------
# Default: ./repos (ignored by Git in the workspace .gitignore)
#
# Examples:
#   repos_dir: ./repos              # relative (recommended)
#   repos_dir: ./custom-repos       # custom relative path

repos_dir: ./repos

# ------------------------------------------------------------------------------
# ai_instructions — Main AI instructions routing file
# ------------------------------------------------------------------------------
# Main instructions file created and managed by Repo Nexus.
# Default: AGENTS.md (recognized by modern AI coding assistants)
#
# Examples:
#   ai_instructions: AGENTS.md     # default standard
#   ai_instructions: CLAUDE.md     # for Anthropic Claude Code CLI
#   ai_instructions: GEMINI.md     # for Google Gemini / Antigravity CLI
#
ai_instructions: AGENTS.md

# ------------------------------------------------------------------------------
# code_workspace — VS Code / Cursor multi-root workspace file
# ------------------------------------------------------------------------------
# Automatically generates and maintains a multi-root .code-workspace file mapping
# the workspace root and all active member repository clones.
#
# Default: false
#
# Examples:
#   code_workspace: false                    # disabled (default)
#   code_workspace: true                     # generates <workspace-name>.code-workspace
#   code_workspace: workspace.code-workspace # custom filename
#
code_workspace: false

# ------------------------------------------------------------------------------
# git_hooks — Automated workspace Git hooks
# ------------------------------------------------------------------------------
# Enables automated Git hooks in `.rnex/hooks/` (post-merge auto-sync and
# optional plugin triggers like Karpathy wiki lint on commit/push).
#
# Default: true (when initialized in a Git repository)
#
# Examples:
#   git_hooks: true     # active (core.hooksPath = .rnex/hooks)
#   git_hooks: false    # disabled
#
git_hooks: true

# ------------------------------------------------------------------------------
# plugins — Workspace plugins and AI instruction packs
# ------------------------------------------------------------------------------
# Plugins extend your workspace with curated AI guidelines, context rules,
# and scaffolding templates scoped within `.rnex/plugins/<plugin-name>/`.
#
# Manage plugins with:
#   rnex plugin list              # View available and active plugins
#   rnex plugin enable <name>     # Enable plugin in workspace
#   rnex plugin disable <name>    # Disable plugin from workspace
#
# Built-in plugins:
#   karpathy-llm   — Andrej Karpathy's agent behavioral principles,
#                    context engineering guidelines, and LLM Wiki architecture

plugins:
  # karpathy-llm: {}

# ------------------------------------------------------------------------------
# repos — Member repositories managed by Repo Nexus
# ------------------------------------------------------------------------------
# Each repo has:
#   url:      Git repository URL (SSH or HTTPS).
#   enabled:  true (default) keeps the repo active in workspace.
#             false disables the repo (skipped by rnex clone, rnex exec, etc.).
#             Can be overridden locally in .local.rnex.yaml.
#   rnex_dir: true (default) creates an isolated .rnex/ directory inside the member repo
#             for storing rnex-related documents, rules, workflows, and scripts.
#             Set to false to leave the member repository completely untouched.
#
# Examples:
#   backend:
#     url: git@github.com:myorg/backend-api.git
#     enabled: true        # default
#     rnex_dir: true       # default
#
#   frontend:
#     url: https://github.com/myorg/web-app.git
#     enabled: true
#     rnex_dir: true
#
#   analytics:
#     url: git@github.com:myorg/analytics.git
#     enabled: false       # disabled: skipped by clone & exec
#     rnex_dir: false

repos:
  # backend:
  #   url: git@github.com:myorg/backend-api.git
  #   rnex_dir: true
  #
  # frontend:
  #   url: https://github.com/myorg/web-app.git
  #   rnex_dir: true
  #
  # analytics:
  #   url: git@github.com:myorg/analytics.git
  #   enabled: false
