# ==============================================================================
# rnex.yaml — Repo Nexus Workspace Configuration (Full Example)
# ==============================================================================
# This file is the central team manifest for a Repo Nexus workspace (committed to git).
#
# TWO-LEVEL CONFIGURATION:
#   1. Repo Config (rnex.yaml): Shared across team, tracks member repos, plugins.
#   2. Local Config (.local.rnex.yaml): Machine-specific (gitignored), overrides/provides
#      local member repo paths and developer-specific plugin settings.
#
# Place it in your workspace root directory and run `rnex fix` to apply.
#
# For more information: https://github.com/nu-nenoi/repo-nexus

# ------------------------------------------------------------------------------
# repos_dir — Directory for repository symlinks
# ------------------------------------------------------------------------------
# Relative paths are resolved relative to this config file's location.
# Default: ./repos
#
# Examples:
#   repos_dir: ./repos              # relative (recommended)
#   repos_dir: ./workspace/repos    # nested relative path
#   repos_dir: /opt/dev/repos       # absolute path

repos_dir: ./repos

# ------------------------------------------------------------------------------
# plugins — Workspace plugins and AI instruction packs
# ------------------------------------------------------------------------------
# Plugins extend your workspace with curated AI guidelines, context rules,
# and scaffolding templates within the `.rnex/` workspace root directory.
#
# Manage plugins with:
#   rnex plugin list              # View available and active plugins
#   rnex plugin enable <name>     # Enable plugin in workspace
#   rnex plugin disable <name>    # Disable plugin from workspace
#
# Built-in plugins:
#   karpathy-llm   — Andrej Karpathy's agent behavioral principles,
#                    multi-repo context engineering, and LLM Wiki pattern
#
# Local / custom plugins can also be placed in .rnex/plugins/<name>/

plugins:
  # karpathy-llm: {}

# ------------------------------------------------------------------------------
# repos — Member repositories managed by Repo Nexus
# ------------------------------------------------------------------------------
# Each repo has:
#   path:     Absolute or relative path to the repository on disk.
#             Relative paths are resolved relative to this config file.
#   scope:    "visible" (default) creates a symlink in repos_dir.
#             "hidden" removes the symlink but keeps the registration.
#   rnex_dir: true (default) creates an .rnex/ directory inside the member repo
#             for storing rnex-related documents, rules, workflows, and scripts.
#             Set to false to disable and leave the repository completely untouched.
#
# Examples with absolute paths:
#   backend-api:
#     path: /Users/dev/projects/backend-api
#     scope: visible
#     rnex_dir: true
#
# Examples with relative paths:
#   frontend:
#     path: ../frontend-app
#     scope: visible
#     rnex_dir: true
#
#   shared-lib:
#     path: ../../libs/shared
#     scope: hidden
#     rnex_dir: false

repos:
