name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'

  test:
    name: Automated Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Test Suite
        run: |
          chmod +x rnex tests/test_cli.sh
          ./tests/test_cli.sh

  publish:
    name: Publish to npm & GitHub Packages
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump Patch Version (on merge to main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Increment patch version by 1 in package.json (single source of truth)
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          NEW_VERSION="${NEW_VERSION#v}"
          echo "Incremented patch version to ${NEW_VERSION}"

          # Commit and push version bump back to repository
          git commit -am "chore: bump patch version to ${NEW_VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Check and Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Checking if ${PKG_NAME}@${PKG_VERSION} is already published on npm..."
          PUBLISHED_VERSION=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)

          if [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
            echo "Version ${PKG_VERSION} of ${PKG_NAME} is already published to npm. Skipping."
          else
            echo "Publishing ${PKG_NAME}@${PKG_VERSION} to npm registry..."
            npm publish --access public
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Configuring GitHub Packages registry..."
          npm config set @nu-nenoi:registry=https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}

          # Scope package name to @nu-nenoi for GitHub Packages
          node -e '
            const pkg = require("./package.json");
            pkg.name = "@nu-nenoi/repo-nexus";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            require("fs").writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Checking if @nu-nenoi/repo-nexus@${PKG_VERSION} is already published on GitHub Packages..."
          GPR_VERSION=$(npm view "@nu-nenoi/repo-nexus@${PKG_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)

          if [ "$GPR_VERSION" = "$PKG_VERSION" ]; then
            echo "Version ${PKG_VERSION} of @nu-nenoi/repo-nexus is already published on GitHub Packages. Skipping."
          else
            echo "Publishing @nu-nenoi/repo-nexus@${PKG_VERSION} to GitHub Packages..."
            npm publish --registry=https://npm.pkg.github.com
          fi
